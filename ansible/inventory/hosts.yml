all:
  vars:
    ansible_user: ansible
    ansible_ssh_private_key_file: "{{ inventory_dir }}/../.ssh/id_rsa_felcloud"
    # Bastion jump host: set BASTION_IP in your environment (.env) before running playbooks.
    ansible_ssh_common_args: >-
      -o ProxyJump=ansible@{{ lookup('env', 'BASTION_IP') | default('203.0.113.119', true) }}
      -o StrictHostKeyChecking=no
      -o UserKnownHostsFile=/dev/null
    vip_address: 10.20.20.246
    # bastion_public_ip is used as a TLS SAN entry. Set BASTION_IP in your .env.
    bastion_public_ip: "{{ lookup('env', 'BASTION_IP') | default('203.0.113.119', true) }}"
    edge_cidr: 10.20.20.0/24
    mgmt_cidr: 10.20.10.0/24
    sandbox_cidr: 10.20.30.0/24
  children:
    gateways:
      hosts:
        gw1:
          ansible_host: 10.20.10.24
          keepalived_role: MASTER
          keepalived_priority: 150
          edge_ip: 10.20.20.82
          sandbox_ip: 10.20.30.86
        gw2:
          ansible_host: 10.20.10.164
          keepalived_role: BACKUP
          keepalived_priority: 100
          edge_ip: 10.20.20.190
          sandbox_ip: 10.20.30.224
